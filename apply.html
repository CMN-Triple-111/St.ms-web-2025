<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admissions Application | St. Movens School</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-800 font-sans">

    <!-- Header Section -->
    <header class="bg-blue-900 text-white py-6 shadow-md">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-wide">ST. MOVENS SCHOOL</h1>
            <span class="text-sm bg-blue-800 px-3 py-1 rounded">Online Admissions Portal</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="container mx-auto px-4 py-10 max-w-4xl">
        <div class="bg-white rounded-lg shadow-lg p-8 border-t-4 border-blue-900">
            <h2 class="text-2xl font-semibold mb-2 text-blue-900">Student Application Form</h2>
            <p class="text-sm text-gray-600 mb-6">Please complete all required fields accurately. Modeled after premier institutional admissions standards.</p>

            <form id="admissionForm" class="space-y-6">
                <!-- Section 1: Parent / Guardian Authentication & Details -->
                <fieldset class="border p-4 rounded-md">
                    <legend class="text-lg font-medium text-blue-900 px-2">1. Parent / Guardian Details</legend>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                        <div>
                            <label class="block text-sm font-medium">Full Name *</label>
                            <input type="text" name="parent_name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Email Address (for portal access) *</label>
                            <input type="email" name="parent_email" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Phone Number *</label>
                            <input type="tel" name="parent_phone" required placeholder="+260..." class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Relationship to Student *</label>
                            <select name="relationship" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                                <option value="Father">Father</option>
                                <option value="Mother">Mother</option>
                                <option value="Legal Guardian">Legal Guardian</option>
                            </select>
                        </div>
                    </div>
                </fieldset>

                <!-- Section 2: Student Information -->
                <fieldset class="border p-4 rounded-md">
                    <legend class="text-lg font-medium text-blue-900 px-2">2. Prospective Student Information</legend>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-2">
                        <div>
                            <label class="block text-sm font-medium">Student's Full Name *</label>
                            <input type="text" name="student_name" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Date of Birth *</label>
                            <input type="date" name="student_dob" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Gender *</label>
                            <select name="student_gender" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Grade Applying For *</label>
                            <select name="grade_applying" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                                <option value="Year 7">Year 7 / Grade 7</option>
                                <option value="Year 8">Year 8 / Grade 8</option>
                                <option value="Year 9">Year 9 / Grade 9</option>
                                <option value="Year 10">Year 10 / Form 1</option>
                                <option value="Year 11">Year 11 / Form 2</option>
                                <option value="Sixth Form">Sixth Form (AS/A Level)</option>
                            </select>
                        </div>
                    </div>
                </fieldset>

                <!-- Section 3: Medical & Special Educational Needs (SEN) -->
                <fieldset class="border p-4 rounded-md">
                    <legend class="text-lg font-medium text-blue-900 px-2">3. Medical & Educational Background</legend>
                    <div class="space-y-4 mt-2">
                        <div>
                            <label class="block text-sm font-medium">Medical Conditions, Allergies or Special Needs Disclosures</label>
                            <textarea name="medical_notes" rows="3" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2" placeholder="List any relevant details or write 'None'"></textarea>
                        </div>
                        <div>
                            <label class="block text-sm font-medium">Previous School Attended</label>
                            <input type="text" name="previous_school" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm border p-2">
                        </div>
                    </div>
                </fieldset>

                <!-- Submission Button -->
                <div class="text-right">
                    <button type="submit" id="submitBtn" class="bg-blue-900 text-white font-semibold px-6 py-3 rounded-md shadow hover:bg-blue-800 transition">
                        Submit Secure Application
                    </button>
                </div>
            </form>

            <div id="responseMessage" class="mt-4 hidden p-4 rounded-md"></div>
        </div>
    </main>

    <script>
        const API_URL = 'https://https://gns-corporation.com/server2000/api/submit.php'; // Update with your Bluehost server domain endpoint

        document.getElementById('admissionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            const msgBox = document.getElementById('responseMessage');
            
            submitBtn.disabled = true;
            submitBtn.textContent = 'Encrypting & Submitting...';
            
            const formData = new FormData(this);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });

                const result = await response.json();
                
                msgBox.classList.remove('hidden');
                if (response.ok) {
                    msgBox.className = 'mt-4 p-4 rounded-md bg-green-100 text-green-800 border border-green-300';
                    msgBox.innerHTML = `<strong>Success!</strong> ${result.message}<br>Your Tracking Application ID: <strong>${result.application_id}</strong>`;
                    this.reset();
                } else {
                    throw new Error(result.message || 'Server error occurred.');
                }
            } catch (error) {
                msgBox.className = 'mt-4 p-4 rounded-md bg-red-100 text-red-800 border border-red-300';
                msgBox.textContent = `Submission Failed: ${error.message}. Please check connection or CORS configurations.`;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Submit Secure Application';
            }
        });
    </script>
</body>
</html>
